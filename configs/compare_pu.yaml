# ==============================================================================
# Comparison config with p.u. normalization
# ==============================================================================

experiment_name: compare_pu
device: auto
seed: 42

data:
  data_dir: data/data_training
  train_split: 0.8
  num_channels: 6
  seq_length: 240
  normalize: true
  normalization_mode: pu

line_params:
  Unom_kv: 110.0
  L_km: 50.0
  r1_ohm_km: 0.20046
  x1_ohm_km: 0.4155

preprocessing:
  mains_freq_hz: 50.0
  remove_dc_enabled: true
  t0_enabled: true
  t0_pre_ms: 50.0
  t0_post_ms: 70.0
  t0_eta_i: 0.5
  t0_eta_u: 0.85

model:
  type: cnn1d
  num_filters: 64
  kernel_size: 5
  dropout: 0.3

training:
  batch_size: 32
  num_epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 1e-5
  loss: smooth_l1
  gradient_clip: 1.0

scheduler:
  type: cosine
  warmup_epochs: 5

early_stopping:
  enabled: true
  patience: 15
  min_delta: 1e-4

checkpointing:
  save_dir: checkpoints
  save_best_only: true
  save_every_n_epochs: 10

logging:
  log_dir: logs
  log_every_n_batches: 50
