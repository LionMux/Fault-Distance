# ==============================================================================
# BASE CONFIG - foundation for all experiments.
# Do not run directly; used as base via inheritance.
# ==============================================================================

experiment_name: base
device: auto           # auto | cuda | cpu
seed: 42

data:
  data_dir: data/data_training
  train_split: 0.8
  num_channels: 6
  seq_length: 240         # fs=2000 Hz, [50ms pre + 70ms post] = 120 ms => 240 samples
  normalize: true
  normalization_mode: standard  # 'standard' | 'pu'

line_params:
  Unom_kv: 110.0       # Nominal voltage [kV]
  L_km: 50.0           # Line length [km]
  r1_ohm_km: 0.20046   # Positive sequence resistance [Ohm/km]
  x1_ohm_km: 0.4155    # Positive sequence reactance [Ohm/km]

# ============ SIGNAL PREPROCESSING ============
# NOTE: sampling_freq_hz is NOT required for normal use.
# comtrade_to_csv.py stores the real fs in each CSV's 'fs_hz' column and
# dataset.py reads it automatically per file.
#
# Set sampling_freq_hz ONLY as a fallback for legacy CSV files that were
# converted without the 'fs_hz' column.
preprocessing:
  # sampling_freq_hz: <omitted> -> read from each CSV 'fs_hz' column
  mains_freq_hz: 50.0
  remove_dc_enabled: true         # notebook primary DC removal method
  t0_enabled: true                # notebook: enable fault-inception cropping
  t0_pre_ms: 50.0                 # notebook: 50 ms pre-fault
  t0_post_ms: 70.0                # notebook: 70 ms post-fault (после t0)
  t0_eta_i: 0.5                   # notebook: current-rise threshold (50%)
  t0_eta_u: 0.85                  # notebook: voltage-drop threshold (85%)

model:
  type: cnn1d          # cnn1d | dilated_cnn1d | resnet1d
  num_filters: 64
  kernel_size: 5
  dropout: 0.3

training:
  batch_size: 32
  num_epochs: 100
  optimizer: adam      # adam | sgd | adamw
  learning_rate: 0.001
  weight_decay: 1e-5
  loss: smooth_l1      # mse | mae | smooth_l1
  gradient_clip: 1.0

scheduler:
  type: cosine         # cosine | linear | exponential | None
  warmup_epochs: 5

early_stopping:
  enabled: true
  patience: 15
  min_delta: 1e-4

checkpointing:
  save_dir: checkpoints
  save_best_only: true
  save_every_n_epochs: 5

logging:
  log_dir: logs
  log_every_n_batches: 50

# ============ DIPLOMA ACTIVATION EXPORT (defaults disabled) ============
activation_export:
  enabled: false
  layers: auto
  capture_epochs: ["first", "best", "every_n:5"]
  probe_mode: first_val_sample
  export_formats: ["png", "csv"]
  output_dir: activations
  max_channels_to_plot: 8
  dpi: 300
  strict_activation_export: false
